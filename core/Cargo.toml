[package]
name = "rustyleaf-core"
version = "0.0.2"
edition = "2021"
description = "Rust/WASM core for Rustyleaf — WebGL2 map rendering engine"
repository = "https://github.com/mehdilhy/rustyleaf"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--strip-producers"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
lol_alloc = "0.4"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "WebGlContextAttributes",
  "HtmlImageElement",
  "console"
] }
earcutr = "0.5.0"  # Mapbox-earcut polygon triangulation (replaces lyon, ~10x smaller)
