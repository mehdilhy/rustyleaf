[package]
name = "rustyleaf-core"
version = "0.0.2"
edition = "2021"
description = "Rust/WASM core for Rustyleaf — WebGL2 map rendering engine"
repository = "https://github.com/mehdilhy/rustyleaf"
license = "MIT"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window",
  "Document",
  "HtmlCanvasElement",
  "WebGl2RenderingContext",
  "WebGlProgram",
  "WebGlShader",
  "WebGlBuffer",
  "WebGlTexture",
  "WebGlUniformLocation",
  "WebGlVertexArrayObject",
  "WebGlContextAttributes",
  "ImageData",
  "HtmlImageElement",
  "EventTarget",
  "MouseEvent",
  "WheelEvent",
  "KeyboardEvent",
  "console",
  "Performance"
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
rstar = "0.11"  # For spatial indexing and hit-testing
lyon_tessellation = "1.0"
lyon_path = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"
