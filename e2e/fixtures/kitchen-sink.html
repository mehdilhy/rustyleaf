<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rustyleaf — Kitchen Sink (every feature + 1M points)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; }
  #map { width: 1000px; height: 700px; }
</style>
</head>
<body>
  <div id="map"></div>
  <script type="module">
    import * as R from "../../src/rustyleaf-api.js";

    window.__errors = [];
    window.addEventListener('error', (e) => window.__errors.push(String(e.message)));
    window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason)));

    // Deterministic PRNG so runs are comparable
    function mulberry32(a) {
      return function () {
        let t = (a += 0x6D2B79F5);
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(1234);

    const map = new R.Map('map', { center: [48.8566, 2.3522], zoom: 12 });
    window.__map = map;
    window.__R = R;
    window.__events = {};
    for (const evt of ['load', 'movestart', 'moveend', 'zoomstart', 'zoomend',
      'layeradd', 'popupopen', 'boxzoomend', 'resize']) {
      map.on(evt, () => { window.__events[evt] = (window.__events[evt] || 0) + 1; });
    }

    // Raster tiles (network — assertions must not depend on them loading)
    new R.TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
    }).addTo(map);

    // ---- 1,000,000 GPU points ----
    const N = 1_000_000;
    const points = new Array(N);
    for (let i = 0; i < N; i++) {
      points[i] = {
        lat: 48.66 + rand() * 0.4,
        lng: 2.05 + rand() * 0.6,
        size: 4,
        color: i % 3 === 0 ? '#e0393e' : (i % 3 === 1 ? '#2a6fdb' : '#12995f'),
        meta: null,
      };
    }
    const pointLayer = new R.PointLayer();
    pointLayer.add(points);
    pointLayer.addTo(map);

    // ---- 2,000 line segments (thick) + 200 polygons ----
    const lines = new R.LineLayer();
    const lineData = [];
    for (let i = 0; i < 2000; i++) {
      const lat = 48.7 + rand() * 0.3;
      const lng = 2.1 + rand() * 0.5;
      lineData.push({
        coords: [{ lat, lng }, { lat: lat + 0.004, lng: lng + 0.006 }],
        color: '#00bcd4', width: 3,
      });
    }
    lines.add(lineData);
    lines.addTo(map);

    const polys = new R.PolygonLayer();
    const polyData = [];
    for (let i = 0; i < 200; i++) {
      const lat = 48.7 + rand() * 0.3;
      const lng = 2.1 + rand() * 0.5;
      polyData.push({
        rings: [[
          { lat, lng }, { lat, lng: lng + 0.01 },
          { lat: lat + 0.007, lng: lng + 0.01 }, { lat: lat + 0.007, lng },
        ]],
        color: '#7b2fbf40',
      });
    }
    polys.add(polyData);
    polys.addTo(map);

    // ---- GeoJSON with filter + onEachFeature (popup + per-feature click) ----
    // Placed well outside the 1M-point cloud's bounding box (lat 48.66-49.06,
    // lng 2.05-2.65) so the click hit-test unambiguously resolves to these
    // features rather than a random overlapping background point.
    window.__geojsonIsolatedView = [48.40, 1.75];
    window.__featureClicks = [];
    new R.GeoJSONLayer({
      type: 'FeatureCollection',
      features: [
        { type: 'Feature', geometry: { type: 'Point', coordinates: [1.75, 48.40] }, properties: { name: 'center' } },
        { type: 'Feature', geometry: { type: 'Point', coordinates: [1.70, 48.42] }, properties: { name: 'nw' } },
        { type: 'Feature', geometry: { type: 'Point', coordinates: [1.80, 48.38] }, properties: { name: 'filtered', skip: true } },
      ],
    }, {
      pointColor: '#ffd400', pointSize: 18,
      filter: (f) => !f.properties.skip,
      onEachFeature: (f, h) => {
        h.bindPopup('KS: ' + f.properties.name);
        h.on('click', () => window.__featureClicks.push(f.properties.name));
      },
    }).addTo(map);

    // ---- 200 markers ----
    for (let i = 0; i < 200; i++) {
      new R.Marker([48.75 + rand() * 0.2, 2.2 + rand() * 0.3], { size: 12 }).addTo(map);
    }

    // ---- shapes + groups + controls ----
    const shapes = new R.FeatureGroup([
      new R.Circle([48.8738, 2.2950], { radius: 700, color: '#12995f66' }),
      new R.Rectangle([[48.84, 2.36], [48.85, 2.39]], { color: '#e0393e55' }),
      new R.CircleMarker([48.8566, 2.30], { radius: 9, color: '#ff00ff' }),
    ]);
    shapes.addTo(map);
    new R.LayersControl(null, { Shapes: shapes }).addTo(map);
    new R.ZoomControl().addTo(map);
    new R.ScaleControl().addTo(map);

    // ---- overlays + grid ----
    new R.ImageOverlay(
      'data:image/gif;base64,R0lGODlhAQABAIAAAP8AACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==',
      [[48.85, 2.33], [48.87, 2.37]], { opacity: 0.4 }
    ).addTo(map);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 10 10');
    svg.innerHTML = '<rect width="10" height="10" fill="#2a6fdb44"/>';
    new R.SVGOverlay(svg, [[48.83, 2.28], [48.845, 2.31]]).addTo(map);
    class KSGrid extends R.GridLayer {
      createTile(c) {
        const d = document.createElement('div');
        d.className = 'ks-tile';
        d.style.cssText = 'border:1px dashed rgba(0,0,0,.15)';
        return d;
      }
    }
    new KSGrid().addTo(map);

    // ---- fps instrumentation ----
    window.__fps = (durationMs = 2000) => new Promise((resolve) => {
      let frames = 0;
      const start = performance.now();
      function tick(now) {
        frames++;
        if (now - start < durationMs) requestAnimationFrame(tick);
        else resolve(Math.round((frames / (now - start)) * 100000) / 100);
      }
      requestAnimationFrame(tick);
    });

    // continuous pan stress: pans back and forth in a rAF loop while measuring
    window.__fpsWhilePanning = (durationMs = 2000) => new Promise((resolve) => {
      let frames = 0;
      let dir = 1;
      const start = performance.now();
      function tick(now) {
        frames++;
        map.panBy(6 * dir, 2 * dir);
        if (frames % 45 === 0) dir = -dir;
        if (now - start < durationMs) requestAnimationFrame(tick);
        else resolve(Math.round((frames / (now - start)) * 100000) / 100);
      }
      requestAnimationFrame(tick);
    });

    window.__ready = true;
  </script>
</body>
</html>
