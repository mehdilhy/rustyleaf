<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rustyleaf — GL Resource Instrumentation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; }
  #map { width: 800px; height: 600px; }
  #status { position: absolute; top: 10px; left: 10px; color: #0f0; font: 12px monospace; }
</style>
</head>
<body>
  <div id="map"></div>
  <div id="status"></div>
  <script>
    // ---------- GL instrumentation: install BEFORE map creation ----------
    const _orig = HTMLCanvasElement.prototype.getContext;
    const glStats = {
      createTexture: 0, deleteTexture: 0,
      createBuffer: 0, deleteBuffer: 0,
      createShader: 0, deleteShader: 0,
      createProgram: 0, deleteProgram: 0,
    };
    window.__glStats = glStats;

    HTMLCanvasElement.prototype.getContext = function(type, attrs) {
      const ctx = _orig.call(this, type, attrs);
      if (!ctx || !type.includes('webgl')) return ctx;
      const orig = {};
      for (const key of Object.keys(glStats)) {
        orig[key] = ctx[key];
        ctx[key] = function(...args) {
          glStats[key]++;
          return orig[key].apply(this, args);
        };
      }
      return ctx;
    };
  </script>
  <script type="module">
    import { Map, PointLayer, TileLayer, GeoJSONLayer } from "../../src/rustyleaf-api.js";

    try {
      const map = new Map(document.getElementById('map'), { center: [48.8566, 2.3522], zoom: 13 });
      window.__map = map;

      const tiles = new TileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png');
      tiles.addTo(map);

      const geojson = new GeoJSONLayer(null, { pointColor: '#ff0000', pointSize: 6 });
      geojson.addTo(map);
      geojson.loadData({
        type: "Feature",
        geometry: { type: "Point", coordinates: [2.3499, 48.8530] }
      });

      let frames = 0;
      function checkReady() {
        frames++;
        if (frames >= 20) {
          window.__rustyleafReady = true;
          document.getElementById('status').textContent = 'READY';
        } else {
          requestAnimationFrame(checkReady);
        }
      }
      requestAnimationFrame(checkReady);
    } catch (err) {
      document.getElementById('status').textContent = 'ERROR: ' + err.message;
    }
  </script>
</body>
</html>
